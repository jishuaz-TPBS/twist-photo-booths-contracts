<!--
  =========================================================================
  TWIST PHOTO BOOTHS — EVENT CONTRACT & E-SIGNATURE PAGE
  =========================================================================
  HOW THIS WORKS
  --------------
  1. You (staff) open this page and click "Staff Login" at the very
     bottom, enter your passcode, and fill in a booking's details
     (client name, event date, package, price, etc). Clicking
     "Generate Signing Link" builds a unique link with that booking's
     details baked right into the URL — nothing is stored on a server
     for this step, so it works the instant you host this file.
  2. You send that link to your client (text/email). When they open
     it, they see the contract already filled in with their event
     details, they draw their signature and type their full name, and
     submit.
  3. On submit, the page (a) instantly gives the client a downloadable
     PDF of their signed contract, and (b) — once you finish the short
     one-time setup below — sends you an email and logs the signed
     contract to a Google Sheet you can check from any device.

  THREE THINGS TO CONFIGURE BEFORE GOING LIVE
  --------------------------------------------
  1. STAFF_PASSCODE below — change it from the default.
  2. APPS_SCRIPT_URL below — see "twist-contracts-backend.gs" (sent
     alongside this file) for the ~5 minute setup that gives you
     automatic email notifications + a Google Sheet dashboard. Until
     you paste a real URL in, clients can still sign and download
     their PDF — you just won't get an automatic copy.
  3. CONTRACT_TEMPLATE further down — this is a standard draft
     agreement. Swap in your real wording whenever you're ready
     (this is NOT legal advice — have an attorney review your final
     terms).

  HOSTING
  -------
  This is a single, self-contained HTML file. It needs to live
  somewhere your clients can open it from a normal web link — e.g. a
  page on your existing Twist Photo Booths website (most site builders
  like Wix/Squarespace/GoDaddy let you embed or upload custom HTML),
  or a free static host like Netlify Drop. It will NOT work as a
  Claude.ai artifact link, because signing needs to reach your email
  from your CLIENT's browser, and Claude's hosted pages can't make
  outside network calls.
  =========================================================================
-->

/* =========================================================================
   Helpers
   ========================================================================= */

function fillTemplate(str, data){
  return str.replace(/\{\{(\w+)\}\}/g, (_, k) => (data[k] !== undefined && data[k] !== "") ? data[k] : `[${k}]`);
}

function b64EncodeUnicode(str){
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (_, p1) => String.fromCharCode('0x' + p1)));
}
function b64DecodeUnicode(str){
  return decodeURIComponent(Array.prototype.map.call(atob(str), c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
}
function encodeBooking(obj){
  return encodeURIComponent(b64EncodeUnicode(JSON.stringify(obj)));
}
function decodeBooking(str){
  try { return JSON.parse(b64DecodeUnicode(decodeURIComponent(str))); }
  catch(e){ return null; }
}
function makeBookingId(){
  return Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,5).toUpperCase();
}
function fmtMoney(v){
  if(v === undefined || v === "") return "";
  const n = parseFloat(v);
  return isNaN(n) ? v : "$" + n.toFixed(2);
}
function fmtDate(v){
  if(!v) return "";
  const d = new Date(v + "T00:00:00");
  if(isNaN(d)) return v;
  return d.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
}

  document.getElementById('genLink').onclick = () => {

/* =========================================================================
   VIEW: Client — review + sign
   ========================================================================= */
let sigCtx, hasDrawn = false, drawing = false, lastX = 0, lastY = 0;

function renderSigningPage(booking){

  const filled = {
    clientName: booking.clientName || '',

    eventType: booking.eventType || '',

        <div><span class="label">Event type</span>${filled.eventType || '—'}</div>
        <div><span class="label">Venue</span>${filled.venueName || '—'}</div>
        <div><span class="label">Package</span>${filled.packageName || '—'}</div>
        <div><span class="label">Total price</span>${filled.price || '—'}</div>
        <div><span class="label">Deposit</span>${filled.deposit || '—'}</div>
        <div><span class="label">Balance due</span>${filled.balanceDueDate || '—'}</div>

    </div>

    <div class="card">
      <h2>Sign & Submit</h2>
      <p class="muted">${fillTemplate(CONTRACT_TEMPLATE.signBlock, filled)}</p>

      <input type="text" id="typedName" placeholder="Full legal name">

      <label>Draw your signature below</label>
      <canvas id="sigPad"></canvas>
      <div class="sig-actions">
        <button id="clearSig">Clear signature</button>
        <span class="muted" id="sigHint">Use your mouse or finger to sign</span>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="agreeBox">

function setupSignaturePad(){
  const canvas = document.getElementById('sigPad');
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;
  sigCtx = canvas.getContext('2d');
  sigCtx.scale(ratio, ratio);
  sigCtx.strokeStyle = '#1d1d1d';
  sigCtx.lineWidth = 2.2;
  sigCtx.lineCap = 'round';
  hasDrawn = false;

  function pos(e){
    const r = canvas.getBoundingClientRect();
    const point = e.touches ? e.touches[0] : e;
    return { x: point.clientX - r.left, y: point.clientY - r.top };
  }
  function start(e){
    e.preventDefault();
    drawing = true;
    const p = pos(e);
    lastX = p.x; lastY = p.y;
  }
  function move(e){
    if(!drawing) return;
    e.preventDefault();
    const p = pos(e);
    sigCtx.beginPath();
    sigCtx.moveTo(lastX, lastY);
    sigCtx.lineTo(p.x, p.y);
    sigCtx.stroke();
    lastX = p.x; lastY = p.y;
    hasDrawn = true;
  }
  function end(){ drawing = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);

  document.getElementById('clearSig').onclick = (e) => {
    e.preventDefault();
    sigCtx.clearRect(0, 0, canvas.width, canvas.height);
    hasDrawn = false;
  };
}

function handleSubmit(booking, filled){
  const typedName = document.getElementById('typedName').value.trim();
  const agreed = document.getElementById('agreeBox').checked;
  const canvas = document.getElementById('sigPad');

  if(!typedName || !agreed || !hasDrawn){
    document.getElementById('signErr').style.display = 'block';
    return;
  }
  document.getElementById('signErr').style.display = 'none';

  const btn = document.getElementById('submitSig');
  btn.disabled = true;
  btn.textContent = 'Submitting…';

  const signatureDataUrl = canvas.toDataURL('image/png');
  const signedAt = new Date().toISOString();

  const payload = Object.assign({}, booking, {
    signedName: typedName,
    signature: signatureDataUrl,
    signedAt: signedAt
  });

  // Fire-and-forget to the Apps Script backend, if configured.
  if(APPS_SCRIPT_URL){
    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    }).catch(() => { /* fire-and-forget: ignore network errors here */ });
  }

  generateSignedPdf(booking, filled, typedName, signatureDataUrl, signedAt);
  renderSuccess(!!APPS_SCRIPT_URL);
}

function generateSignedPdf(booking, filled, typedName, signatureDataUrl, signedAt){
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'letter' });
    const margin = 48;
    let y = margin;
    const maxWidth = 612 - margin*2;

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(16);
    doc.text('Twist Photo Booths — Event Booking Agreement', margin, y);
    y += 26;

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    const facts = [
      ['Client', filled.clientName], ['Event date', filled.eventDate],
      ['Event type', filled.eventType], ['Venue', filled.venueName],
      ['Package', filled.packageName], ['Total price', filled.price],
      ['Deposit', filled.deposit], ['Balance due', filled.balanceDueDate]
    ];
    facts.forEach(([k,v]) => {
      doc.text(`${k}: ${v || '—'}`, margin, y);
      y += 14;
    });
    y += 10;

    doc.setFontSize(9.5);
    const addParagraph = (text) => {
      const lines = doc.splitTextToSize(text, maxWidth);
      lines.forEach(line => {
        if(y > 740){ doc.addPage(); y = margin; }
        doc.text(line, margin, y);
        y += 12.5;
      });
      y += 6;
    };

    addParagraph(fillTemplate(CONTRACT_TEMPLATE.intro, filled));
    CONTRACT_TEMPLATE.sections.forEach(s => {
      doc.setFont('helvetica', 'bold');
      addParagraph(s.h);
      doc.setFont('helvetica', 'normal');
      addParagraph(fillTemplate(s.p, filled));
    });

    if(y > 650){ doc.addPage(); y = margin; }
    doc.setFont('helvetica', 'bold');
    addParagraph('Signature');
    doc.setFont('helvetica', 'normal');
    addParagraph(fillTemplate(CONTRACT_TEMPLATE.signBlock, filled));

    doc.text(`Signed name: ${typedName}`, margin, y); y += 16;
    doc.text(`Signed at: ${new Date(signedAt).toLocaleString()}`, margin, y); y += 10;

    try {
      doc.addImage(signatureDataUrl, 'PNG', margin, y, 200, 65);
      y += 75;
    } catch(e){ /* image add best-effort */ }

    const safeName = (typedName || 'client').replace(/[^a-z0-9]+/gi, '-');
    doc.save(`Twist-Photo-Booths-Contract-${safeName}.pdf`);
  } catch(err){
    console.error('PDF generation failed', err);
  }
}

function renderSuccess(backendConfigured){
  app.innerHTML = `
    <div class="card success-screen">
      <div class="icon">✓</div>
      <h2 style="border:none;">You're all signed!</h2>
      <p class="muted">A PDF copy of your signed agreement has been downloaded to your device.
      ${backendConfigured
        ? 'Twist Photo Booths has also been notified automatically.'
        : 'Please also send a copy of that PDF to Twist Photo Booths to complete your booking.'}</p>
    </div>
  `;
}
